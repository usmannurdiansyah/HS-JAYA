name: Build HS JAYA APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extract Android project
        run: unzip -q HS_JAYA_ANDROID_PROJECT.zip -d buildsrc
      - name: Build APK
        run: |
          gradle -p buildsrc/HS_JAYA_ANDROID_PROJECT assembleDebug
          cp buildsrc/HS_JAYA_ANDROID_PROJECT/app/build/outputs/apk/debug/app-debug.apk HS-JAYA.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HS-JAYA-debug-APK
          path: HS-JAYA.apk
